services:
  mysql:
    image: mysql:8.0
    container_name: tour_booking_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: tour_booking
    ports:
      - "3306:3306"
    volumes:
      - tour_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
  backend:
    build: ./backend
    container_name: tour_booking_be
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: tour_booking
      JWT_SECRET: change_me_in_prod
      JWT_EXPIRES: 7d
      HOLD_MINUTES: 15
    depends_on:
      mysql:
        condition: service_healthy
  frontend:
    build: ./frontend
    container_name: tour_booking_fe
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  tour_mysql_data:
